name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore solution
        run: dotnet restore U1.Business.sln

      - name: Check source conventions
        shell: pwsh
        run: pwsh -File tests/verify-source.ps1

      - name: Build application with warnings as errors
        run: dotnet build src/U1.Business/U1.Business.csproj --no-restore --configuration Release -warnaserror

      - name: Build test projects
        shell: pwsh
        run: |
          dotnet build tests/U1.Business.Tests/U1.Business.Tests.csproj --no-restore --configuration Release
          if ($LASTEXITCODE -ne 0) { throw "API test project build failed." }
          dotnet build tests/U1.Business.BrowserTests/U1.Business.BrowserTests.csproj --no-restore --configuration Release
          if ($LASTEXITCODE -ne 0) { throw "Browser test project build failed." }

      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          $files = Get-ChildItem src/U1.Business/wwwroot -Filter *.js -Recurse
          foreach ($file in $files) {
            node --check $file.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "JavaScript syntax check failed: $($file.FullName)"
            }
          }

      - name: Start SQL Server LocalDB
        shell: pwsh
        run: |
          sqllocaldb start MSSQLLocalDB
          if ($LASTEXITCODE -ne 0) {
            throw "SQL Server LocalDB could not be started."
          }

      - name: Run API integration tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE/test-results/api" | Out-Null
          dotnet test tests/U1.Business.Tests/U1.Business.Tests.csproj --no-build --configuration Release -- --results-directory "$env:GITHUB_WORKSPACE/test-results/api" --report-xunit-trx --report-xunit-trx-filename api.trx

      - name: Install Playwright Chromium
        shell: pwsh
        run: |
          & "tests/U1.Business.BrowserTests/bin/Release/net10.0/playwright.ps1" install chromium
          if ($LASTEXITCODE -ne 0) {
            throw "Playwright Chromium installation failed."
          }

      - name: Run browser behavior tests
        shell: pwsh
        env:
          U1_TEST_ARTIFACTS: ${{ github.workspace }}\test-results\browser\artifacts
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE/test-results/browser" | Out-Null
          dotnet test tests/U1.Business.BrowserTests/U1.Business.BrowserTests.csproj --no-build --configuration Release -- --results-directory "$env:GITHUB_WORKSPACE/test-results/browser" --report-xunit-trx --report-xunit-trx-filename browser.trx

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-diagnostics-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: warn
          retention-days: 7
