name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore solution
        run: dotnet restore U1.Business.sln

      - name: Build solution
        run: dotnet build U1.Business.sln --no-restore --configuration Release -warnaserror

      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          $files = Get-ChildItem src/U1.Business/wwwroot -Filter *.js -Recurse
          foreach ($file in $files) {
            node --check $file.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "JavaScript syntax check failed: $($file.FullName)"
            }
          }

      - name: Start SQL Server LocalDB
        shell: pwsh
        run: |
          sqllocaldb start MSSQLLocalDB
          if ($LASTEXITCODE -ne 0) {
            throw "SQL Server LocalDB could not be started."
          }

      - name: Run API integration tests
        run: dotnet test tests/U1.Business.Tests/U1.Business.Tests.csproj --no-build --configuration Release

      - name: Install Playwright Chromium
        shell: pwsh
        run: |
          & "tests/U1.Business.BrowserTests/bin/Release/net10.0/playwright.ps1" install chromium
          if ($LASTEXITCODE -ne 0) {
            throw "Playwright Chromium installation failed."
          }

      - name: Run browser behavior tests
        run: dotnet test tests/U1.Business.BrowserTests/U1.Business.BrowserTests.csproj --no-build --configuration Release
